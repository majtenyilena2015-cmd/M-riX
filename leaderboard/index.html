<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>MáriX — közös ranglista</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1020;--line:#293550;--muted:#aab7cf;--cyan:#67e8f9;--gold:#fcd34d}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#1c3150,var(--bg) 60%);color:#f8fafc;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;padding:32px 16px}
    main{max-width:760px;margin:auto}
    a{color:var(--cyan);text-decoration:none}a:hover{text-decoration:underline}
    .back{font-weight:700}
    header{margin:24px 0 20px;padding:28px;border:1px solid #67e8f944;border-radius:24px;background:linear-gradient(130deg,#141c34,#19243e);box-shadow:0 18px 55px #0005}
    .tag{margin:0;color:#f0abfc;font-size:.78rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase}
    h1{margin:6px 0 10px;font-size:clamp(2rem,8vw,3.25rem);line-height:1.05;letter-spacing:-.04em}
    header p:last-child{margin:0;color:#cbd5e1}
    .board{overflow:hidden;border:1px solid var(--line);border-radius:18px;background:#10182c}
    .row{display:grid;grid-template-columns:4rem 1fr 7rem;align-items:center;gap:8px;padding:15px 20px;border-bottom:1px solid #202b43}
    .row:last-child{border-bottom:0}
    .labels{color:var(--muted);font-size:.75rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
    .rank{color:#8290aa;font-weight:900}.top .rank{color:var(--gold)}
    .name{font-weight:800;overflow-wrap:anywhere}.level{text-align:right;color:var(--cyan);font-weight:900}
    .status{padding:26px 18px;text-align:center;color:#cbd5e1}
    footer{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:14px 2px;color:var(--muted);font-size:.9rem}
    button{border:1px solid #67e8f955;border-radius:10px;background:#16243c;color:var(--cyan);font:inherit;font-weight:800;padding:8px 14px;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}
    @media(max-width:460px){body{padding:20px 12px}.row{grid-template-columns:2.5rem 1fr 5.5rem;padding:14px 12px}header{padding:22px}}
  </style>
</head>
<body>
  <main>
    <a class="back" href="https://github.com/majtenyilena2015-cmd/M-riX">← MáriX játék</a>
    <header>
      <p class="tag">MáriX · közös ranglista</p>
      <h1>Ki jutott a legtovább?</h1>
      <p>A játékosok legjobb teljesített pályája, becenév szerint.</p>
    </header>
    <section class="board" aria-label="Játékosok rangsora">
      <div class="row labels"><span>#</span><span>Játékos</span><span class="level">Pálya</span></div>
      <div id="results" class="status" role="status" aria-live="polite">Ranglista betöltése…</div>
    </section>
    <footer><span>A beceneved nyilvános. Ne használd a teljes nevedet.</span><button id="refresh" type="button">Frissítés</button></footer>
  </main>
  <script>
    const API = 'https://marix-ranglista.majtenyi-lena2015.chatgpt.site/api/leaderboard';
    const results = document.querySelector('#results');
    const refresh = document.querySelector('#refresh');
    async function loadBoard() {
      refresh.disabled = true;
      results.className = 'status';
      results.textContent = 'Ranglista betöltése…';
      try {
        const response = await fetch(API, { cache: 'no-store' });
        if (!response.ok) throw new Error('Nem sikerült betölteni a ranglistát.');
        const data = await response.json();
        const entries = Array.isArray(data.leaderboard) ? data.leaderboard : [];
        if (!entries.length) {
          results.textContent = 'Még nincs eredmény. Indítsd el a MáriXet, válassz becenevet, és teljesíts egy pályát!';
          return;
        }
        const fragment = document.createDocumentFragment();
        entries.forEach((entry, index) => {
          const row = document.createElement('div');
          row.className = 'row' + (index < 3 ? ' top' : '');
          const rank = document.createElement('span');
          rank.className = 'rank';
          rank.textContent = String(index + 1).padStart(2, '0');
          const name = document.createElement('span');
          name.className = 'name';
          name.textContent = String(entry.nickname || 'Játékos');
          const level = document.createElement('span');
          level.className = 'level';
          level.textContent = String(entry.level) + ' / 30';
          row.append(rank, name, level);
          fragment.append(row);
        });
        results.className = '';
        results.replaceChildren(fragment);
      } catch {
        results.className = 'status';
        results.textContent = 'A ranglista most nem érhető el. Próbáld újra később.';
      } finally {
        refresh.disabled = false;
      }
    }
    refresh.addEventListener('click', loadBoard);
    loadBoard();
  </script>
</body>
</html>
