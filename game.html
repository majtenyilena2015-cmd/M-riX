<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>MáriX — mini platformjáték</title>
  <style>
    :root{--ink:#18243b;--cream:#fff7de;--red:#ff4f4f;--gold:#ffd84d;--blue:#4fb8ff}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 15%,#243b67,#10172a 70%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:white;overflow:hidden}
    .wrap{width:min(100vw,1100px);padding:16px}.top{display:flex;align-items:center;justify-content:space-between;margin:0 6px 10px}.logo{font-size:clamp(27px,5vw,48px);font-weight:1000;letter-spacing:-3px;text-shadow:0 5px 0 #a91f36,0 8px 18px #0008}.logo span{color:var(--gold)}.hint{font-weight:800;opacity:.8;font-size:14px}
    .frame{position:relative;border:5px solid #fff9;border-radius:22px;overflow:hidden;box-shadow:0 22px 70px #0009;background:#70c9ff;aspect-ratio:16/9}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
    .panel{position:absolute;inset:0;display:grid;place-items:center;background:#10172aa8;backdrop-filter:blur(4px);transition:.2s;z-index:2}.card{text-align:center;background:var(--cream);color:var(--ink);border:5px solid var(--ink);border-radius:24px;padding:clamp(16px,3vw,34px);box-shadow:0 12px 0 #0a1020;max-width:640px;max-height:90%;overflow:auto;margin:12px}.card h1{margin:0 0 8px;font-size:clamp(36px,7vw,64px);line-height:1;color:var(--red);text-shadow:3px 3px 0 var(--ink)}.card p{font-weight:750;line-height:1.5}.card small{display:block;margin-top:10px;opacity:.7}.play{display:inline-block;border:0;border-radius:99px;background:var(--red);color:white;font:900 17px system-ui;padding:11px 20px;box-shadow:0 6px 0 #a91f36;cursor:pointer;text-decoration:none;margin:5px}.play.secondary{background:#7046cf;box-shadow:0 6px 0 #41247e}.play:active{transform:translateY(4px);box-shadow:0 2px 0 #a91f36}.hidden{display:none}
    .shopbtn{position:absolute;right:18px;top:18px;border:2px solid #70f7ff;background:#10142edb;color:#fff;border-radius:12px;padding:10px 16px;font-weight:1000;cursor:pointer}.skins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.skin{border:3px solid #18243b;background:white;border-radius:14px;padding:8px;font-weight:900;cursor:pointer;min-width:0}.skin.selected{background:#70f7ff}.skin.locked{background:#e9e5df}.skin.chest{border-color:#b765d9}.skin i{display:inline-block;width:18px;height:18px;border-radius:5px;vertical-align:middle;margin-right:5px}.wallet{font-size:19px;color:#7046cf;font-weight:1000}.shopnote{min-height:1.5em;font-weight:800;color:#9f2854}.shopactions{display:flex;justify-content:center;flex-wrap:wrap}
    @media(max-width:600px){.skins{grid-template-columns:repeat(2,1fr)}.card{max-height:95%;padding:10px}.skin{font-size:12px}.skin small{font-size:11px}.play{font-size:13px;padding:7px 12px;margin:3px}}
    .touch{display:none;position:absolute;inset:auto 14px 14px;justify-content:space-between;pointer-events:none}.touch button{pointer-events:auto;width:74px;height:74px;border:3px solid #fff9;background:#15213ad9;color:white;border-radius:20px;font-size:30px;font-weight:900;touch-action:none}.touch .left{display:flex;gap:10px}.jump{width:94px!important}
    @media(pointer:coarse){.touch{display:flex}.hint{display:none}.wrap{padding:4px}.top{margin:3px 8px}.frame{border-width:3px;border-radius:14px}}
  </style>
</head>
<body>
<main class="wrap">
  <div class="top"><div class="logo">Mári<span>X</span></div><div class="hint">A D mozgás · Space ugrás · X / Shift: X-lökés · R újra</div></div>
  <div class="frame">
    <canvas id="game" width="960" height="540" aria-label="MáriX platformjáték"></canvas>
    <button class="shopbtn" id="shopBtn">🛍️ SHOP</button>
    <div class="panel" id="panel"><div class="card"><h1>MáriX</h1><p>30 egyre nehezebb pálya, szilánkok, kulcsok és titkos skineket rejtő ládák.</p><button class="play" id="play">Játék indítása</button><small>5 élet · Esc: szünet · X/Shift: X-lökés · P: shop</small></div></div>
    <div class="touch"><div class="left"><button data-key="ArrowLeft">◀</button><button data-key="ArrowRight">▶</button></div><div class="left"><button data-key="KeyX">X</button><button class="jump" data-key="Space">↑</button></div></div>
  </div>
</main>
<script>
const c=document.querySelector('#game'),x=c.getContext('2d'),panel=document.querySelector('#panel'),play=document.querySelector('#play'),shopBtn=document.querySelector('#shopBtn');
const W=960,H=540,keys={},GRAV=.72;let state,player,camera,last=0,platforms=[],coinPos=[],enemyPos=[],goalX=1700;
const LEVELS=[
 {name:'Neon kezdet',goal:1760,platforms:[[-100,475,520,100],[520,475,430,100],[1050,475,800,100],[280,375,150,24],[650,345,160,24],[920,285,150,24],[1230,370,160,24],[1500,305,150,24]],coins:[[335,325],[710,295],[975,235],[1290,320],[1560,255]],enemies:[[600,439,1],[1190,439,-1]]},
 {name:'Törött adatút',goal:2160,platforms:[[-100,475,400,100],[400,475,360,100],[850,475,310,100],[1260,475,390,100],[1740,475,510,100],[220,360,150,24],[540,300,150,24],[800,380,130,24],[1030,315,150,24],[1370,350,150,24],[1600,275,150,24],[1900,350,160,24]],coins:[[275,310],[595,250],[855,330],[1085,265],[1425,300],[1655,225],[1960,300]],enemies:[[470,439,1],[940,439,-1],[1340,439,1]]},
 {name:'Impulzus-torony',goal:2320,platforms:[[-100,475,430,100],[420,475,300,100],[810,475,300,100],[1200,475,340,100],[1630,475,300,100],[2020,475,390,100],[250,360,140,24],[500,280,140,24],[760,200,140,24],[1020,300,140,24],[1300,220,150,24],[1580,320,140,24],[1850,245,150,24],[2100,340,150,24]],coins:[[305,310],[555,230],[815,150],[1075,250],[1355,170],[1635,270],[1905,195],[2160,290]],enemies:[[500,439,1],[900,439,-1],[1280,439,1],[1710,439,-1]]},
 {name:'Végtelen hurok',goal:2800,platforms:[[-100,475,340,100],[330,475,300,100],[720,475,310,100],[1120,475,300,100],[1510,475,310,100],[1910,475,300,100],[2290,475,600,100],[180,370,130,24],[430,300,140,24],[670,235,140,24],[920,320,140,24],[1180,250,140,24],[1450,180,140,24],[1710,300,140,24],[1970,220,140,24],[2230,340,140,24],[2480,260,150,24]],coins:[[235,320],[485,250],[725,185],[975,270],[1235,200],[1505,130],[1765,250],[2025,170],[2285,290],[2540,210]],enemies:[[390,439,1],[790,439,-1],[1190,439,1],[1590,439,-1],[1990,439,1],[2400,439,-1]]},
 {name:'X-mag',goal:3100,platforms:[[-100,475,360,100],[350,475,330,100],[770,475,310,100],[1170,475,340,100],[1600,475,310,100],[2000,475,340,100],[2430,475,300,100],[2820,475,380,100],[190,350,140,24],[470,285,150,24],[720,215,140,24],[970,335,150,24],[1250,260,150,24],[1510,350,140,24],[1780,280,150,24],[2070,350,150,24],[2340,270,160,24],[2630,200,150,24],[2880,320,150,24]],coins:[[245,300],[525,235],[775,165],[1025,285],[1305,210],[1565,300],[1835,230],[2125,300],[2400,220],[2685,150],[2935,270]],enemies:[[420,439,1],[880,439,-1],[1250,439,1],[1760,439,-1],[2190,439,1],[2500,439,-1],[2900,439,1]]}
];
const EXTRA_NAMES=['Szilánkmező','Sötét átjáró','Lüktető perem','Kék szakadék','Fénycsapda','Viharhíd','Törött oszlopok','Villámösvény','Árnyékugrás','Neon szökés','Kristályfolyosó','Torzulás','Éjszakai próba','Impulzus-híd','Ibolya mélység','Hullámtörés','Láthatár','Szélcsatorna','Kvantumlépcső','Szilánkvihar','Utolsó átjáró','Fekete mag','Villanó tér','X-vihar','Végső hálózat'];
for(let n=0;n<EXTRA_NAMES.length;n++){
  const parts=6+Math.floor(n/5),platforms=[[-100,475,430,100]],coins=[],enemies=[];let left=330;
  for(let j=0;j<parts;j++){
    const gap=90+((j*31+n*17)%Math.min(55,28+Math.floor(n/2))),width=285+((n*23+j*37)%95);
    left+=gap;platforms.push([left,475,width,100]);
    const high=350-((j+n)%3)*38;platforms.push([left+65,high,135,22]);
    coins.push([left+125,high-50],[left+width-65,425]);
    if(j>0||n>4)enemies.push([left+Math.min(width-70,115+(j*19)%90),439,j%2?-1:1]);left+=width;
  }
  LEVELS.push({name:EXTRA_NAMES[n],goal:left-45,platforms,coins,enemies});
}
const SKINS=[
 {name:'Alap X',price:0,body:'#131b3d',edge:'#70f7ff',eye:'#ff477e'},
 {name:'Plazma',price:20,body:'#542080',edge:'#ff73f1',eye:'#70f7ff'},
 {name:'Aranymag',price:35,body:'#6e4711',edge:'#ffd84d',eye:'#fff5bd'},
 {name:'Nulla',price:55,body:'#06070d',edge:'#f4f4ff',eye:'#75ff8b'},
 {name:'Láva',price:75,body:'#622019',edge:'#ff7235',eye:'#ffe19b'},
 {name:'Jégkristály',price:95,body:'#174364',edge:'#8ceaff',eye:'#fff'},
 {name:'Galaxis',price:120,body:'#29215f',edge:'#b99aff',eye:'#ffe872'},
 {name:'Villám',price:150,body:'#43354e',edge:'#fff35a',eye:'#82f7ff'},
 {name:'Fantóm',chest:true,body:'#302c50',edge:'#dcb9ff',eye:'#ff6cba'},
 {name:'Smaragd',chest:true,body:'#103c31',edge:'#55f5ab',eye:'#fbffbd'},
 {name:'Rubin',chest:true,body:'#521b34',edge:'#ff627f',eye:'#ffe5a0'},
 {name:'Kozmosz',chest:true,body:'#111b45',edge:'#83a7ff',eye:'#ffb0fa'},
 {name:'Napkorona',chest:true,body:'#693818',edge:'#ffb733',eye:'#fff'},
 {name:'Ametiszt',chest:true,body:'#322054',edge:'#ba7dff',eye:'#f6dfff'}
];
function saved(){try{let s=JSON.parse(localStorage.getItem('marixShop'))||{};let owned=Array.isArray(s.owned)?[...new Set([0,...s.owned.filter(i=>Number.isInteger(i)&&i>=0&&i<SKINS.length)])]:[0];return{wallet:Number.isFinite(s.wallet)?Math.max(0,s.wallet):0,owned,skin:owned.includes(s.skin)?s.skin:0,keys:Number.isFinite(s.keys)?Math.max(0,s.keys):0,cleared:Number.isInteger(s.cleared)?Math.max(0,Math.min(LEVELS.length,s.cleared)):0}}catch(e){return{wallet:0,owned:[0],skin:0,keys:0,cleared:0}}}function saveShop(){try{localStorage.setItem('marixShop',JSON.stringify({wallet:state.wallet,owned:state.owned,skin:state.skin,keys:state.keys,cleared:state.cleared}))}catch(e){}}
function reset(full=true){if(full){let s=saved();state={score:0,lives:5,mode:'play',time:0,level:Math.min(s.cleared,LEVELS.length-1),wallet:s.wallet,owned:s.owned,skin:s.skin,keys:s.keys,cleared:s.cleared}}let L=LEVELS[state.level];platforms=L.platforms;coinPos=L.coins;enemyPos=L.enemies;goalX=L.goal;state.coins=coinPos.map(([x,y])=>({x,y,taken:false}));state.enemies=enemyPos.map(([x,y,d])=>({x,y,w:34,h:30,d,alive:true,start:x}));state.mode='play';player={x:80,y:410,w:31,h:43,vx:0,vy:0,ground:false,face:1,inv:0,coyote:0,jumpBuffer:0,dashReady:true,dashLock:false,dashTrail:0};camera=0;}
function rect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function hit(){if(player.inv>0)return;state.lives--;if(state.lives<=0)return finish(false);player.x=80;camera=0;player.y=390;player.vx=0;player.vy=-8;player.inv=100}
function finish(win){if(win&&state.cleared<LEVELS.length){state.cleared=LEVELS.length;state.keys++;saveShop()}state.mode=win?'win':'lose';panel.classList.remove('hidden');panel.querySelector('.card').innerHTML=`<h1>${win?'GRATULÁLUNK, KIVITTED!':'Vége!'}</h1><p>${win?'Mind a 30 pályát teljesítetted! Jutalom: 1 kulcs!':'Elfogytak az életeid.'}<br>Pontszám: <b>${state.score}</b></p><button class="play" id="again">Újrakezdés</button>`;document.querySelector('#again').onclick=start}
function nextLevel(){let completed=state.level+1,first=completed>state.cleared;if(first){state.cleared=completed;if(completed%3===0)state.keys++;saveShop()}state.mode='pause';panel.classList.remove('hidden');panel.querySelector('.card').innerHTML=`<h1>Pálya kész!</h1><p><b>${LEVELS[state.level].name}</b> teljesítve.<br>Pontszám: ${state.score} · Élet: ${state.lives}${first&&completed%3===0?'<br>🗝️ Jutalom: 1 kulcs!':''}</p><button class="play" id="next">Következő pálya</button>`;document.querySelector('#next').onclick=()=>{state.level++;reset(false);panel.classList.add('hidden')}}
function openShop(){if(state.mode!=='play'||!panel.classList.contains('hidden'))return;state.mode='shop';panel.classList.remove('hidden');renderShop()}
function renderShop(message=''){panel.querySelector('.card').innerHTML=`<h1>SHOP & LÁDÁK</h1><div class="wallet">◈ ${state.wallet} szilánk &nbsp; 🗝️ ${state.keys} kulcs</div><p class="shopnote" role="status">${message||'Minden 3. új pályáért 1 kulcs jár. Egy láda 1 kulcsba kerül.'}</p><div class="shopactions"><button class="play secondary" id="buyKey">Kulcs vásárlása · ◈ 30</button><button class="play" id="openChest">🎁 Láda nyitása · 🗝️ 1</button></div><div class="skins">${SKINS.map((s,i)=>`<button class="skin ${state.skin===i?'selected':''} ${state.owned.includes(i)?'':'locked'} ${s.chest?'chest':''}" data-skin="${i}"><i style="background:${s.body};border:3px solid ${s.edge}"></i>${s.name}<small>${state.owned.includes(i)?(state.skin===i?'HASZNÁLOD':'KIVÁLASZTÁS'):(s.chest?'CSAK LÁDÁBÓL':`◈ ${s.price}`)}</small></button>`).join('')}</div><button class="play secondary" id="closeShop">Vissza a játékba</button>`;document.querySelectorAll('[data-skin]').forEach(b=>b.onclick=()=>buySkin(+b.dataset.skin));document.querySelector('#buyKey').onclick=()=>{if(state.wallet<30)return renderShop('Nincs elég szilánkod a kulcshoz.');state.wallet-=30;state.keys++;saveShop();renderShop('Vettél egy kulcsot!')};document.querySelector('#openChest').onclick=openChest;document.querySelector('#closeShop').onclick=()=>{state.mode='play';panel.classList.add('hidden')}}
function buySkin(i){let s=SKINS[i];if(state.owned.includes(i))state.skin=i;else if(s.chest)return renderShop('Ez a skin csak ládából szerezhető.');else if(state.wallet>=s.price){state.wallet-=s.price;state.owned.push(i);state.skin=i}else return renderShop('Nincs elég szilánkod ehhez a skinhez.');saveShop();renderShop(`${s.name} skin kiválasztva!`)}
function openChest(){if(!state.keys)return renderShop('A ládához kulcs kell. Minden 3. új pálya után kapsz egyet.');const possible=SKINS.map((s,i)=>s.chest&&!state.owned.includes(i)?i:-1).filter(i=>i>=0);if(!possible.length)return renderShop('Már minden ládás skin a tiéd!');const i=possible[Math.floor(Math.random()*possible.length)];state.keys--;state.owned.push(i);state.skin=i;saveShop();renderShop(`🎉 A ládából ${SKINS[i].name} skin került elő!`)}
function pauseGame(){if(state.mode==='play'){state.mode='pause';panel.classList.remove('hidden');panel.querySelector('.card').innerHTML=`<h1>Szünet</h1><p>${LEVELS[state.level].name}<br>Pontszám: ${state.score} · Élet: ${state.lives}</p><button class="play" id="resume">Folytatás</button><button class="play secondary" id="quit">Kilépés a főmenübe</button>`;document.querySelector('#resume').onclick=resumeGame;document.querySelector('#quit').onclick=showTitle}else if(state.mode==='pause')resumeGame();else if(state.mode==='shop'){state.mode='play';panel.classList.add('hidden')}}
function resumeGame(){state.mode='play';panel.classList.add('hidden')}
function showTitle(){reset(true);state.mode='title';panel.classList.remove('hidden');panel.querySelector('.card').innerHTML=`<h1>MáriX</h1><p>30 egyre nehezebb pálya. Teljesített pályák: ${state.cleared}/30.</p><button class="play" id="titlePlay">Folytatás</button><small>Esc: szünet · X/Shift: X-lökés · P: shop</small>`;document.querySelector('#titlePlay').onclick=start}
function start(){reset(true);panel.classList.add('hidden')}
function update(){if(state.mode!=='play')return;state.time++;let dir=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0),jump=keys.Space||keys.ArrowUp||keys.KeyW;
  if(dir)player.vx+=(dir*5-player.vx)*.34;else player.vx*=.55;player.vx=Math.max(-5,Math.min(5,player.vx));if(Math.abs(player.vx)<.08)player.vx=0;if(dir)player.face=dir;
  if(jump&&!player.jumpLock){player.jumpBuffer=8;player.jumpLock=true}if(!jump){player.jumpLock=false;if(player.vy<0)player.vy+=.5}if(player.ground)player.coyote=8;else player.coyote=Math.max(0,player.coyote-1);player.jumpBuffer=Math.max(0,player.jumpBuffer-1);
  if(player.jumpBuffer>0&&player.coyote>0){player.vy=-14;player.ground=false;player.coyote=0;player.jumpBuffer=0}let dash=keys.KeyX||keys.ShiftLeft||keys.ShiftRight;if(dash&&player.dashReady&&!player.dashLock){player.vx=player.face*12;player.vy=-1;player.dashReady=false;player.dashLock=true;player.dashTrail=12}if(!dash)player.dashLock=false;if(player.ground)player.dashReady=true;if(player.dashTrail>0)player.dashTrail--;player.vy=Math.min(14,player.vy+(player.dashTrail?GRAV*.18:GRAV));
  player.x+=player.vx;for(const p of platforms){let q={x:p[0],y:p[1],w:p[2],h:p[3]};if(rect(player,q)){if(player.vx>0)player.x=q.x-player.w;else if(player.vx<0)player.x=q.x+q.w;player.vx=0}}
  player.y+=player.vy;player.ground=false;for(const p of platforms){let q={x:p[0],y:p[1],w:p[2],h:p[3]};if(rect(player,q)){if(player.vy>0){player.y=q.y-player.h;player.vy=0;player.ground=true}else{player.y=q.y+q.h;player.vy=1}}}if(player.y>H+80)hit();player.x=Math.max(0,player.x);if(player.inv>0)player.inv--;
  state.coins.forEach(o=>{if(!o.taken&&rect(player,{x:o.x-13,y:o.y-13,w:26,h:26})){o.taken=true;state.score+=100;state.wallet++;saveShop()}});
  state.enemies.forEach(e=>{if(!e.alive)return;e.x+=e.d*(.65+state.level*.025);if(Math.abs(e.x-e.start)>70)e.d*=-1;if(rect(player,e)){if(player.dashTrail>0){e.alive=false;player.vx*=.7;state.score+=200}else if(player.vy>1&&player.y+player.h<e.y+23){e.alive=false;player.vy=-9;state.score+=200}else hit()}});
  if(player.x>goalX-45){if(state.level<LEVELS.length-1)nextLevel();else finish(true)}camera+=(Math.max(0,Math.min(Math.max(0,goalX-850),player.x-300))-camera)*.09;
}
function draw(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#100d35');g.addColorStop(.6,'#193f67');g.addColorStop(1,'#0b1731');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#70f7ff';for(let i=0;i<90;i++){let sx=(i*137-camera*.08)%W,sy=(i*83)%390;x.globalAlpha=.18+(i%5)/10;x.fillRect(sx,sy,2+(i%3),2+(i%3))}x.globalAlpha=1;x.strokeStyle='#5bdff522';for(let yy=80;yy<H;yy+=55){x.beginPath();x.moveTo(0,yy);x.lineTo(W,yy);x.stroke()}
 x.save();x.translate(-camera,0);for(const p of platforms){x.fillStyle='#17284e';x.fillRect(...p);x.fillStyle='#41e4dc';x.fillRect(p[0],p[1],p[2],7);x.strokeStyle='#8c62ff55';x.lineWidth=2;for(let bx=p[0]+15;bx<p[0]+p[2];bx+=42)x.strokeRect(bx,p[1]+20,25,18)}
 state.coins.forEach((o,i)=>{if(o.taken)return;let bob=Math.sin((state.time+i*19)/12)*5;x.fillStyle='#ffd83d';x.beginPath();x.arc(o.x,o.y+bob,14,0,7);x.fill();x.strokeStyle='#b87812';x.lineWidth=3;x.stroke();x.fillStyle='#9a6410';x.font='900 17px system-ui';x.textAlign='center';x.fillText('X',o.x,o.y+bob+6)});
 state.enemies.forEach(e=>{if(!e.alive)return;x.save();x.translate(e.x,e.y);x.fillStyle='#e653ff';x.beginPath();x.moveTo(1,17);x.quadraticCurveTo(4,-2,17,0);x.quadraticCurveTo(31,-2,34,17);x.closePath();x.fill();x.strokeStyle='#70f7ff';x.lineWidth=3;x.stroke();x.fillStyle='#70f7ff';x.beginPath();x.arc(11,8,3,0,7);x.arc(23,6,4,0,7);x.fill();x.fillStyle='#e8faff';x.fillRect(8,16,18,14);x.fillStyle='#10142e';x.fillRect(10,19,4,5);x.fillRect(21,19,4,5);x.restore()});

function loop(t){let steps=Math.min(3,Math.max(1,Math.round((t-last)/16.67)));last=t;while(steps--)update();draw();requestAnimationFrame(loop)}
