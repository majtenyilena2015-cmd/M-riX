name: Publish MáriX Windows download

on:
  push:
    branches: [main]
    paths:
      - "game.html"
      - "launcher.py"
      - "MariX-Windows.zip"
      - ".github/workflows/publish-download.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout game
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Windows executable
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pywebview
          pyinstaller --noconfirm --clean --onefile --windowed --name MariX --add-data "game.html;." launcher.py
      - name: Publish downloadable files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "v1.0.0"
          $notes = "MáriX Windows alkalmazás. Töltsd le és indítsd el a MariX.exe fájlt. A ZIP csomag külön is elérhető."
          gh release view $tag | Out-Null
          gh release upload $tag dist/MariX.exe MariX-Windows.zip --clobber
          gh release edit $tag --title "MáriX Windows" --notes $notes
